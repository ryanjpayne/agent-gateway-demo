admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: upstream_backend
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: ext_proc_cluster
                timeout: 30s
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SEND
                # GCP Agent Gateway uses FULL_DUPLEX_STREAMED, but that enum
                # is only available in Google's managed Envoy builds. BUFFERED
                # is functionally equivalent for non-streaming request/response
                # payloads and works with upstream open-source Envoy.
                request_body_mode: BUFFERED
                response_body_mode: BUFFERED
              message_timeout: 30s
              failure_mode_allow: false
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: ext_proc_cluster
    type: STRICT_DNS
    connect_timeout: 5s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: ext_proc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: aidr-shim
                port_value: 8080
  - name: upstream_backend
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: upstream_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: echo-server
                port_value: 8080
